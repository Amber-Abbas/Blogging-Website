name: PR Validation

on:
  pull_request:
    branches:
      - develop

jobs:
  lint-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install htmlhint
      - run: npx htmlhint "src/**/*.html"

  lint-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install stylelint stylelint-config-standard
      - run: npx stylelint "styles/**/*.css"

  build:
    runs-on: ubuntu-latest
    needs: [lint-html, lint-css]
    steps:
      - uses: actions/checkout@v3
      - run: npm install
      - run: npx parcel build src/home.html
